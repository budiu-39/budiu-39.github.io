<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>&#8203;</title>
<style>
:root{color-scheme:light}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#f5f6f2;color:#63756e;font:15px/1.6 Inter,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
</style></head>
<body>
<p id="m" role="status"></p>
<script>
// Key comes from the share link (#<key> or ?k=<key>), is removed from the address bar,
// and is kept in IndexedDB so later visits to the bare URL open directly.
const $=id=>document.getElementById(id),te=new TextEncoder(),say=t=>{$('m').textContent=t};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const db=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('gate',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');
  r.onsuccess=()=>{const tx=r.result.transaction('k',mode),q=fn(tx.objectStore('k'));tx.oncomplete=()=>res(q.result);tx.onerror=()=>rej(tx.error)};r.onerror=()=>rej(r.error)});
const qs=new URLSearchParams(location.search),key=location.hash.slice(1)||qs.get('k')||'';
const next=()=>{const n=qs.get('next');location.replace(n&&n.startsWith('v/')?n:'v/index.html')};
async function sw(){await navigator.serviceWorker.register('sw.js',{scope:'./'});await navigator.serviceWorker.ready;navigator.serviceWorker.controller?.postMessage('reset')}
async function unlock(bits){
  const aes=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-GCM',false,['decrypt']);
  const mac=await crypto.subtle.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const r=await fetch('x/'+hex(await crypto.subtle.sign('HMAC',mac,te.encode('index.html'))).slice(0,32),{cache:'no-cache'});
  if(!r.ok)throw 0;const b=new Uint8Array(await r.arrayBuffer());
  await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},aes,b.slice(12));
  await db('readwrite',s=>s.put({aes,mac},'keys'));
}
(async()=>{
  if(!('serviceWorker' in navigator)||!window.indexedDB||!crypto.subtle)return say('此浏览器不支持（隐私窗口可能禁用了 Service Worker），请用普通窗口打开。');
  if(key){qs.delete('k');history.replaceState(null,'',location.pathname+(qs.size?'?'+qs:''))}
  try{
    await sw();
    if(key)await unlock(Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)));
    if(await db('readonly',s=>s.get('keys')))return next();
  }catch(e){}
  say('请用完整的分享链接打开。');
})();
</script>
</body></html>
